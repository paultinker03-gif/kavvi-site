<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Terms of use — Kavvi</title>
    <meta name="description" content="The terms that apply when you use the Kavvi app and website." />
    <meta property="og:title" content="Terms of use — Kavvi" />
    <meta property="og:description" content="The terms that apply when you use the Kavvi app and website." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a white flash.
      try {
        var saved = localStorage.getItem('kavvi-site.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/main-Cmdo_UU2.js"></script>
  </head>
  <body data-page="terms">
    <div id="root"></div>
  </body>
</html>
